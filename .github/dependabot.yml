version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tooling:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
