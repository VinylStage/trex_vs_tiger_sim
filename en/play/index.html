<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run the simulator – T-Rex vs Tiger</title>
    <meta
      name="description"
      content="The T-Rex vs Tiger simulator itself: pick species and counts, run Monte Carlo battles and read win chances with 95% CIs and a battle replay."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="module" src="/src/main-en.ts"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header app-static-head">
        <div class="brand">
          <!-- app-logo -->
          <h1 data-i18n="app.title">T-Rex vs Tiger Simulator</h1>
        </div>
        <a
          class="btn btn-ghost"
          href="/play/"
          hreflang="ko"
          lang="ko"
          data-lang-switch
          data-i18n="lang.switch"
          >한국어</a
        >
      </header>
    </div>
    <noscript>
      <p class="noscript">
        This simulator needs JavaScript. Please enable it in your browser.<br />
        <span lang="ko"
          >이 시뮬레이터는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 켜 주세요.</span
        >
      </p>
    </noscript>
    <!-- site-footer -->
  </body>
</html>
