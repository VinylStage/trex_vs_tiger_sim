<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시뮬레이터 실행 – 티렉스 대 호랑이</title>
    <meta
      name="description"
      content="티렉스 대 호랑이 시뮬레이터의 실행 화면입니다. 종과 마릿수를 고르고 몬테카를로 전투를 돌려 승률과 95% 신뢰구간, 전투 재생을 확인하세요."

    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />

    <div id="app">
      <header class="app-header app-static-head">
