<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OG result card</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root {
        --bg: #f7f6f3;
        --surface: #ffffff;
        --fg: #1b1b1a;
        --muted: #5f5e5a;
        --sub: #45443f;
        --grid: #e3e2de;
        --border: #d9d8d2;
        --trex: #2a78d6;
        --tiger: #eb6834;
        --draw: #8d8c87;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'PretendardBrand';
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .band {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1200px;
        height: 10px;
      }
      .band i {
        position: absolute;
        top: 0;
        height: 10px;
      }
      .left {
        position: absolute;
        left: 76px;
        top: 0;
        width: 560px;
        height: 630px;
      }
      .brand {
        position: absolute;
        top: 64px;
        left: 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 40px;
        height: 40px;
      }
      .brand span {
        font-weight: 600;
        font-size: 24px;
        color: var(--muted);
      }
      h1 {
        position: absolute;
        top: 170px;
        left: 0;
        margin: 0;
        font-weight: 900;
        font-size: 92px;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      h1 span {
        display: block;
        white-space: nowrap;
      }
      .rule {
        position: absolute;
        top: 400px;
        left: 0;
        display: flex;
        gap: 12px;
      }
      .rule i {
        display: block;
        width: 72px;
        height: 8px;
        border-radius: 4px;
      }
      .sub {
        position: absolute;
        top: 432px;
        left: 0;
        margin: 0;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.3;
        letter-spacing: -0.02em;
        color: var(--sub);
        white-space: nowrap;
      }
      .panel {
        position: absolute;
        left: 670px;
        top: 64px;
        width: 466px;
        height: 502px;
        border-radius: 18px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.04),
          0 10px 30px rgb(0 0 0 / 0.05);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="left">
        <div class="brand">
          <img src="../../public/favicon.svg" alt="" /><span>trex-vs-tiger.vinylims.com</span>
        </div>
        <h1 id="title"></h1>
        <div class="rule">
          <i style="background: var(--trex)"></i><i style="background: var(--tiger)"></i>
        </div>
        <p class="sub" id="sub"></p>
      </div>
      <div class="panel"><svg id="panel" width="466" height="502" aria-hidden="true"></svg></div>
      <div class="band">
        <i style="left: 0; width: 598px; background: var(--trex)"></i
        ><i style="left: 601px; width: 599px; background: var(--tiger)"></i>
      </div>
    </div>
    <script>
      (async () => {
        const q = new URLSearchParams(location.search);
        const lang = q.get('lang') === 'en' ? 'en' : 'ko';
        document.documentElement.lang = lang;
        const T = {
          ko: {
            l1: '시뮬레이션',
            l2: '결과 공유',
            sub: ['몬테카를로 스냅샷', '직접 실행해 확인하세요'],
          },
          en: {
            l1: 'Simulation',
            l2: 'result',
            sub: ['A Monte Carlo snapshot', 'Run it yourself to check'],
          },
        }[lang];
        await Promise.all(
          [500, 600, 700, 800, 900].map((w) =>
            document.fonts.load(`${w} 16px PretendardBrand`, `${T.l1} ${T.l2} ${T.sub.join(' ')}`),
          ),
        );
        const title = document.getElementById('title');
        for (const line of [T.l1, T.l2]) {
          const s = document.createElement('span');
          s.textContent = line;
          title.appendChild(s);
        }
        const sub = document.getElementById('sub');
        sub.textContent = T.sub[0];
        sub.appendChild(document.createElement('br'));
        sub.appendChild(document.createTextNode(T.sub[1]));

        // Panel: an abstract result readout. Glyph formation on a grid, then a win bar and three
        // legend rows whose lengths stand in for rates (no numbers: the image is the same for
        // every result link).
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.getElementById('panel');
        const el = (name, attrs) => {
          const n = document.createElementNS(NS, name);
          for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
          svg.appendChild(n);
          return n;
        };
        let d = '';
        for (let x = 0; x <= 467; x += 31.07) d += `M${x.toFixed(2)} 0V250`;
        for (let y = 0; y <= 250; y += 31.07) d += `M0 ${y.toFixed(2)}H466`;
        el('path', { d, stroke: '#e3e2de', 'stroke-width': 1, fill: 'none' });
        const tri = (x, y, L) =>
          `M${x + L * 0.62} ${y}L${x - L * 0.38} ${y - L * 0.34}L${x - L * 0.38} ${y + L * 0.34}Z`;
        for (let i = 0; i < 5; i++) el('path', { d: tri(130, 60 + i * 34, 30), fill: '#2a78d6' });
        let seed = 51;
        const rnd = () => {
          seed = (seed * 1103515245 + 12345) & 0x7fffffff;
          return seed / 0x7fffffff;
        };
        // a loose, uneven cloud ahead of the line (never a closed outline or a letter)
        const placed = [];
        let guard = 0;
        while (placed.length < 46 && guard++ < 5000) {
          const x = 185 + Math.pow(rnd(), 0.8) * 255;
          const y = 22 + rnd() * 206;
          if (placed.some(([px, py]) => Math.hypot(px - x, py - y) < 19)) continue;
          if (rnd() > 0.35 + 0.65 * ((x - 185) / 255)) continue;
          placed.push([x, y]);
          el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 6, fill: '#eb6834' });
        }
        el('line', { x1: 0, y1: 250, x2: 466, y2: 250, stroke: '#d9d8d2', 'stroke-width': 1.5 });
        const barY = 286;
        el('rect', { x: 32, y: barY, width: 402, height: 30, rx: 15, fill: '#e3e2de' });
        el('rect', { x: 32, y: barY, width: 236, height: 30, rx: 15, fill: '#2a78d6' });
        el('rect', { x: 250, y: barY, width: 20, height: 30, fill: '#2a78d6' });
        el('rect', { x: 273, y: barY, width: 130, height: 30, fill: '#eb6834' });
        el('rect', { x: 406, y: barY, width: 28, height: 30, rx: 0, fill: '#8d8c87' });
        el('rect', { x: 420, y: barY, width: 14, height: 30, rx: 7, fill: '#8d8c87' });
        const rows = [
          ['tri', '#2a78d6', 300],
          ['dot', '#eb6834', 170],
          ['sq', '#8d8c87', 46],
        ];
        rows.forEach(([kind, color, w], i) => {
          const y = 360 + i * 44;
          if (kind === 'tri') el('path', { d: tri(44, y, 24), fill: color });
          else if (kind === 'dot') el('circle', { cx: 46, cy: y, r: 9, fill: color });
          else el('rect', { x: 37, y: y - 9, width: 18, height: 18, rx: 3, fill: color });
          el('rect', { x: 72, y: y - 7, width: w, height: 14, rx: 7, fill: color, opacity: 0.85 });
        });
        document.body.dataset.ready = '1';
      })();
    </script>
  </body>
</html>
